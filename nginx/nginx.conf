events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name pozmuz.ru www.pozmuz.ru;
        client_max_body_size 100M;

        # React-фронтенд
        location / {
            root /var/www/pozmuz/POZMUZ_2.0/frontend/build;
            try_files $uri $uri/ /index.html;
        }

        # Статические файлы React
        location /static/ {
            alias /var/www/pozmuz/POZMUZ_2.0/frontend/build/static/;
        }

        # API-запросы к Django
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Медиа-файлы Django
        location /media/ {
            alias /var/www/pozmuz/POZMUZ_2.0/backend/media/;
            add_header Access-Control-Allow-Origin "https://pozmuz.ru" always; # Ограничьте домен
        }

        # Output-файлы
        location /output/ {
            alias /var/www/pozmuz/POZMUZ_2.0/backend/output/;
            add_header Access-Control-Allow-Origin "https://pozmuz.ru" always;
            add_header Cache-Control "no-cache";
            autoindex off;
        }

        # Uploads-файлы
        location /Uploads/ {
            alias /var/www/pozmuz/POZMUZ_2.0/backend/Uploads/;
            add_header Access-Control-Allow-Origin "https://pozmuz.ru" always;
            add_header Cache-Control "no-cache";
            autoindex off;
        }
    }

    server {
        listen 80;
        server_name 176.57.213.254;
        return 301 http://pozmuz.ru$request_uri;
    }
}
