events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name pozmuz.ru www.pozmuz.ru;
        client_max_body_size 100M;  # Для больших файлов

        # React-фронтенд 
        location / {
            root /root/POZMUZ_2.0/frontend/build;
            try_files $uri $uri/ /index.html;
        }

        # Статические файлы React
        location /static/ {
            alias /root/POZMUZ_2.0/frontend/build/static/;
        }

        # API-запросы к Django
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Медиа-файлы Django
        location /media/ {
            alias /root/POZMUZ_2.0/track_separation/media/;
	    add_header Access-Control-Allow-Origin "*" always;
        }
	location /output/{
	    alias /root/POZMUZ_2.0/track_separation/output/;
	    add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache";
            autoindex off;
	}
	location /Uploads/{
            alias /root/POZMUZ_2.0/track_separation/Uploads/;
	    add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache";
            autoindex off;
        }
    }

    server {
        listen 80;
        server_name 176.57.213.254;
        return 301 http://pozmuz.ru$request_uri;
    }
}
